compile_backbone:
  mode: default
data_type: raw_fast
dataloader_args:
  batch_size: 160
  drop_last: true
  num_workers: 16
  pin_memory: false
  prefetch_factor: 2
  seed_worker: true
dataset_args:
  aug_setup:
    aug_type: Sequential
    augmentors:
    - aug_type: OneOf
      augmentors:
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/music
        prob: 1.0
        snr:
        - 2
        - 12
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/noise
        prob: 1.0
        snr:
        - 0
        - 12
      - aug_type: CustomNoise
        babble: true
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/speech
        prob: 1.0
        snr:
        - 7
        - 18
      prob: 0.8
    - aug_type: Reverb
      dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/rirs/simulated_rirs
      file_pattern: '**/*.wav'
      prob: 0.2
    - aug_type: OneOf
      augmentors:
      - aug_type: LowPassAug
        cutoff_ratio: 0.6
        prob: 1.0
        transition_width: 0.08
      prob: 0.25
    prob: 0.9
  bucketing:
    bucket_count: 6
    bucket_width_sec: 1.0
    enable: true
    shuffle_buckets: true
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  num_frms: 200
  resample_rate: 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speed_perturb: true
  varlen:
    enable: true
    max_batch_sec: 900.0
    max_sec: 6.0
    min_sec: 2.0
enable_amp: true
eval_dur: 8.0
exp_dir: exp/vox2_vb2_cnc2/b3_gnorm_110ep/varlen_ptn_ha
log_batch_interval: 25
loss: CrossEntropyLoss
loss_args: {}
loss_weight_decay_mult: 0.1
margin_scheduler: MarginScheduler
margin_update:
  final_margin: 0.2
  fix_start_epoch: 30
  increase_start_epoch: 15
  increase_type: exp
  initial_margin: 0.0
  update_margin: true
mixup_alpha: null
model: ReDimNet2Custom
model_args:
  C: 24
  F: 72
  agg_gnorm: true
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  causal: none
  compress_tconvs: true
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  fm_weigthing_type: NC
  global_context_att: true
  group_divisor: 1
  hop_length: 160
  out_channels: 224
  pooling_func: ASTP
  return_2d_output: true
  spec_in_channels: 1
  spec_params:
    do_preemph: true
    do_spec_aug: false
    norm_signal: true
num_avg: 10
num_epochs: 110
optimizer: SGD
optimizer_args:
  lr: 0.025
  momentum: 0.9
  nesterov: true
  weight_decay: 2.0e-05
projection_args:
  do_lm: false
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  project_type: sphereface2
  scale: 32.0
  t: 3
save_epoch_interval: 1
scheduler: ExponentialDecayPlateauWithWarmup
scheduler_args:
  decay_epochs: 10
  decay_rate: 0.5
  final_lr: 0.0001
  initial_lr: 0.025
  plateau_epochs: 32
  staircase: false
  warm_from_zero: true
  warm_up_epoch: 8
seed: 42
train_data: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join/data.list
train_label: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join/utt2spk
val_type: local
validation:
  vox1: /root/group-shared/voiceprint/data/wespeaker_data/vox1-test
