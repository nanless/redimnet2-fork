# ── 官方结果复现实验 ────────────────────────────────────────────────
#
# 这一份不是用来训练的，是用来**逐位复现官方结果**的。
# 它在同目录 ptn.yaml / lm.yaml 的基础上只加两项，其余一字不改：
#
#   compile_backbone: null   ← 官方配方开着 torch.compile，而实测编译会让
#                              训练**连跑两次结果都不同**（同一棵树、同一份配置，
#                              673/747 个权重张量不一致）。要逐位对比必须关掉。
#
#   legacy_aug: true         ← 退回官方（修复前）的增强行为。本仓库修过
#                              augs.py 两处缺陷（随机上界取不到、短噪声循环复制），
#                              那两处会改变增强的随机流，因此不退回就复现不了。
#
# 另外官方基线（9d38486）的 meters.py 漏了 `meter` 命名空间，训练第 1 步就崩；
# 本仓库已修。这一项不需要开关，修好的是崩溃，不影响数值。
#
# 实测：本配方 + 官方基线（只补 meters 命名空间）= 权重逐位一致
#       （747 个张量全部 0 差异）。见 docs/11。
# b6 LM — large-margin fine-tuning, 1 epoch, on the vox2 + vb2 + cnc2 mix.
#
# Pairs with the PTN recipe ptn_ha.yaml (exp/.../ptn_ha, trained to epoch 120).
# Provenance:
#   * model + spec/fbank + augmentation   <- ptn_ha.yaml (the cnc2 b6 model)
#   * LM schedule (1 epoch, fixed margin 0.3, SGD + ExponentialDecrease,
#     5 s crops / batch 48, do_lm)         <- exp/vox2_vb2_mix/b6_gnorm_50ep/lm_v2
#   * train data = mix_join_lm data.list / utt2spk (>=5 s utts, A_/B_/C_ join)
#
# Inits from the PTN checkpoint; the projection head is reassembled from the PTN
# spk2id.json — all 115,361 LM speakers are a strict subset of PTN's 119,273, so
# the mapping is 1:1 (no random centroids). num_class and epoch_iter are
# auto-computed by train.py from the data — do NOT set them here.
# Augmentation reads MUSAN/RIRS from raw wav dirs via dataset_dir (no LMDB).
#
# Launch (8 GPUs):
#   ./applications/speaker_rec/launch.sh applications/speaker_rec/examples/vb2_vox2_cnc2/recipes/redimnet2/b6/lm.yaml 8
#   (the launcher runs train.py on the config; do_lm + model_ckpt drive LM)

# gpus: removed - not read by the training code; the GPU count comes from the
#   number passed to launch.sh above (and CUDA_VISIBLE_DEVICES).
# grad_accum_steps: removed - gradient accumulation is not implemented.
# eval_step_interval: removed - validation runs once per epoch, not per step.
# scheduler_args.scale_ratio: removed - overwritten at startup by
#   train.py as world_size * batch_size / 64, so the YAML value was discarded.

compile_backbone: null   # 关掉编译：编译会让训练不可复现
data_type: raw_fast
do_lm: true
enable_amp: true
seed: 42

exp_dir: exp/vox2_vb2_cnc2/b6_gnorm_100ep/lm
# NOTE: model_ckpt below loads model_115.pt, while the ptn.yaml for this line
# sets num_epochs: 120 and its exp_dir is named `b6_gnorm_100ep` — three
# different epochs. Confirm which epoch the official result used.
model_ckpt: exp/vox2_vb2_cnc2/b6_gnorm_100ep/ptn_ha/models/model_115.pt
spk2id_map_path: exp/vox2_vb2_cnc2/b6_gnorm_100ep/ptn_ha/spk2id.json

train_data: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join_lm/data.list
train_label: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join_lm/utt2spk

dataloader_args:
  batch_size: 48
  drop_last: true
  num_workers: 24
  pin_memory: false
  prefetch_factor: 2
  seed_worker: true

dataset_args:
  legacy_aug: true         # 退回官方增强行为（见 augs.py 的 LEGACY_AUG_BEHAVIOR）
  num_frms: 500
  resample_rate: 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speed_perturb: false
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  # LM augmentation = the same Sequential tree as ptn_ha, but with its root
  # prob lowered from 0.9 (ptn_ha) to 0.7 below — this matches the lighter aug
  # used by the reference LM (aug_prob 0.6). Change `prob` below to adjust it.
  aug_setup:
    aug_type: Sequential
    prob: 0.7
    augmentors:
    - aug_type: OneOf
      prob: 0.8
      augmentors:
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/music
        snr: [2, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/noise
        snr: [0, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/speech
        snr: [7, 18]
        babble: true
        prob: 1.0
    - aug_type: Reverb
      dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/rirs/simulated_rirs
      file_pattern: '**/*.wav'
      prob: 0.2
    - aug_type: OneOf
      prob: 0.25
      augmentors:
      - aug_type: LowPassAug
        cutoff_ratio: 0.6
        transition_width: 0.08
        prob: 1.0

model: ReDimNet2Custom
model_args:
  C: 64
  F: 72
  agg_gnorm: true
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  causal: none
  compress_tconvs: true
  dual_agg: false
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  fm_weigthing_type: NC
  global_context_att: true
  group_divisor: 1
  hop_length: 160
  out_channels: 224
  pooling_func: ASTP
  return_2d_output: true
  spec_in_channels: 1
  spec_params:
    do_preemph: true
    do_spec_aug: false
    freq_mask_width:
    - 0
    - 6
    norm_signal: true
    time_mask_width:
    - 0
    - 8
  stages_setup:
  - - - 1
      - 1
    - 3
    - 3
    - - - 3
        - 3
    - 64
  - - - 2
      - 1
    - 4
    - 2
    - - - 3
        - 3
    - 64
  - - - 1
      - 2
    - 5
    - 2
    - - - 3
        - 3
    - 48
  - - - 2
      - 1
    - 5
    - 1
    - - - 3
        - 3
    - 48
  - - - 1
      - 2
    - 4
    - 0.75
    - - - 3
        - 3
    - 32
  - - - 2
      - 1
    - 3
    - 0.5
    - - - 3
        - 3
    - 24

loss: CrossEntropyLoss
loss_args: {}
mixup_alpha: null

projection_args:
  do_lm: true
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  project_type: sphereface2
  scale: 32.0
  t: 3

margin_scheduler: MarginScheduler
margin_update:
  final_margin: 0.3
  fix_start_epoch: 1
  increase_start_epoch: 1
  increase_type: exp
  initial_margin: 0.3
  update_margin: true


loss_weight_decay_mult: 0.25
num_epochs: 1
optimizer: SGD
optimizer_args:
  lr: 0.1
  momentum: 0.9
  nesterov: true
  # weight_decay: 0.0001
  weight_decay: 4.0e-05

scheduler: ExponentialDecrease
scheduler_args:
  initial_lr: 0.0001
  final_lr: 2.5e-05
  num_epochs: 1
  warm_from_zero: true
  warm_up_epoch: 0.2

num_avg: 10
save_epoch_interval: 1
eval_dur: 8.0
log_batch_interval: 25
val_type: local
validation:
  vox1: /root/group-shared/voiceprint/data/wespeaker_data/vox1-test
