# 三语料 B6 官方公开配方的复现实验配置。
# 真实官方基线：c5bbe0b76e37df698c403f8844e41304ceab6307。
# 9d38486 属于 zhounan 的非官方提交，不能当作未经修改的官方代码。
# 以官方三语料专用配方为依据，保留模型、批量、轮数、旧版学习率和增强分布。
# 本次明确关闭 torch.compile，继续直接读取增强目录；这些与公开配方有差别。
# legacy_aug 恢复旧版随机上界和短噪声循环填充，不保证整个训练逐位重现。
# 以完整测试录音的等错误率评测结果验收，不能把短训练权重相同当作最终指标复现。
# PTN 训练 120 轮，LM 明确从第 115 轮权重开始，沿用官方 lm.yaml 的 model_ckpt。
# 第 115/120 轮与目录名 100ep 的冲突来自官方文件；作者未公开最终权重选轮记录。
# 云端必须为本实验覆盖独立 exp_dir，并核实 LM 的 model_ckpt 和 spk2id_map_path。
# 核查说明：docs/12-三语料B6官方复现配方核查.md。
# 大间隔微调使用 500 帧固定裁剪、每卡 48 条、1 轮。
# 以 PTN 的 spk2id.json 按说话人名称重组分类头，禁止随机替代。

compile_backbone: null   # 本次固定使用未编译模型，单独记录这一差异
data_type: raw_fast
do_lm: true
enable_amp: true
seed: 42

exp_dir: exp/vox2_vb2_cnc2/b6_gnorm_100ep/lm
# 本次明确沿用官方 LM 配置的第 115 轮初始化；PTN 仍训练完整 120 轮。
# 这是已声明的实验选择，不能据此声称作者最终发布权重一定来自第 115 轮。
model_ckpt: exp/vox2_vb2_cnc2/b6_gnorm_100ep/ptn_ha/models/model_115.pt
spk2id_map_path: exp/vox2_vb2_cnc2/b6_gnorm_100ep/ptn_ha/spk2id.json

train_data: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join_lm/data.list
train_label: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join_lm/utt2spk

dataloader_args:
  batch_size: 48
  drop_last: true
  num_workers: 24
  pin_memory: false
  prefetch_factor: 2
  seed_worker: true

dataset_args:
  legacy_aug: true         # 保留官方版本的随机上界和短噪声循环填充
  num_frms: 500
  resample_rate: 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speed_perturb: false
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  # LM augmentation = the same Sequential tree as ptn_ha, but with its root
  # prob lowered from 0.9 (ptn_ha) to 0.7 below — this matches the lighter aug
  # used by the reference LM (aug_prob 0.6). Change `prob` below to adjust it.
  aug_setup:
    aug_type: Sequential
    prob: 0.7
    augmentors:
    - aug_type: OneOf
      prob: 0.8
      augmentors:
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/music
        snr: [2, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/noise
        snr: [0, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/speech
        snr: [7, 18]
        babble: true
        prob: 1.0
    - aug_type: Reverb
      dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/rirs/simulated_rirs
      file_pattern: '**/*.wav'
      prob: 0.2
    - aug_type: OneOf
      prob: 0.25
      augmentors:
      - aug_type: LowPassAug
        cutoff_ratio: 0.6
        transition_width: 0.08
        prob: 1.0

model: ReDimNet2Custom
model_args:
  C: 64
  F: 72
  agg_gnorm: true
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  causal: none
  compress_tconvs: true
  dual_agg: false
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  fm_weigthing_type: NC
  global_context_att: true
  group_divisor: 1
  hop_length: 160
  out_channels: 224
  pooling_func: ASTP
  return_2d_output: true
  spec_in_channels: 1
  spec_params:
    do_preemph: true
    do_spec_aug: false
    freq_mask_width:
    - 0
    - 6
    norm_signal: true
    time_mask_width:
    - 0
    - 8
  stages_setup:
  - - - 1
      - 1
    - 3
    - 3
    - - - 3
        - 3
    - 64
  - - - 2
      - 1
    - 4
    - 2
    - - - 3
        - 3
    - 64
  - - - 1
      - 2
    - 5
    - 2
    - - - 3
        - 3
    - 48
  - - - 2
      - 1
    - 5
    - 1
    - - - 3
        - 3
    - 48
  - - - 1
      - 2
    - 4
    - 0.75
    - - - 3
        - 3
    - 32
  - - - 2
      - 1
    - 3
    - 0.5
    - - - 3
        - 3
    - 24

loss: CrossEntropyLoss
loss_args: {}
mixup_alpha: null

projection_args:
  do_lm: true
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  project_type: sphereface2
  scale: 32.0
  t: 3

margin_scheduler: MarginScheduler
margin_update:
  final_margin: 0.3
  fix_start_epoch: 1
  increase_start_epoch: 1
  increase_type: exp
  initial_margin: 0.3
  update_margin: true


loss_weight_decay_mult: 0.25
num_epochs: 1
optimizer: SGD
optimizer_args:
  lr: 0.1
  momentum: 0.9
  nesterov: true
  # weight_decay: 0.0001
  weight_decay: 4.0e-05

scheduler: ExponentialDecrease
scheduler_args:
  lr_scaling: legacy       # 八卡、每卡48条：倍率6，实际峰值约4.54715e-4
  initial_lr: 0.0001
  final_lr: 2.5e-05
  num_epochs: 1
  warm_from_zero: true
  warm_up_epoch: 0.2

num_avg: 10
save_epoch_interval: 1
eval_dur: 8.0
log_batch_interval: 25
val_type: local
validation:
  vox1: /root/group-shared/voiceprint/data/wespeaker_data/vox1-test
