# b6 PT v3: 100ep on vox2 + vb2 + cnc2 mix — HARD AUGS variant of ptn.yaml.
#
# Differs from ptn.yaml only in the augmentation setup. Augmentation as
# actually in effect below:
#   * Sequential tree (root prob 0.9) read from dataset_args.aug_setup.
#   * OneOf (prob 0.8) over three CustomNoise branches with explicit SNR
#     ranges — music [2, 12], noise [0, 12], speech [7, 18] with babble: true.
#     These are per-augmentor values, not a named SNR preset.
#   * Reverb (prob 0.2) reading RIR wavs from a raw directory via dataset_dir
#     (no LMDB).
#   * OneOf (prob 0.25) over LowPassAug with a single active branch,
#     cutoff_ratio=0.6 (transition_width 0.08) — used as a spec-aug
#     replacement while do_spec_aug stays False. A second cutoff_ratio=0.5
#     branch is present but commented out, so only 0.6 is in effect.
#   * CodecAug is commented out entirely and does not run.
#
# Schedule, model, optimizer, and training list paths are unchanged from
# ptn.yaml (mix_join data.list / utt2spk).

compile_backbone:
  mode: default
data_type: raw_fast
dataloader_args:
  batch_size: 96
  drop_last: true
  num_workers: 24
  pin_memory: false
  prefetch_factor: 2
  seed_worker: true
# grad_accum_steps: removed - gradient accumulation is not implemented in this
# training stack, so the value was never read.
dataset_args:
  aug_setup:
    aug_type: Sequential
    prob: 0.9
    augmentors:
    - aug_type: OneOf
      prob: 0.8
      augmentors:
      - aug_type: CustomNoise
        dataset_dir: /data/wespeaker_data/raw/musan/music
        snr: [2, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /data/wespeaker_data/raw/musan/noise
        snr: [0, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /data/wespeaker_data/raw/musan/speech
        snr: [7, 18]
        babble: true
        prob: 1.0
    - aug_type: Reverb
      dataset_dir: /data/wespeaker_data/raw/rirs/simulated_rirs
      file_pattern: '**/*.wav'
      prob: 0.2
    - aug_type: OneOf
      prob: 0.25
      augmentors:
      # - aug_type: LowPassAug
      #   cutoff_ratio: 0.5
      #   transition_width: 0.08
      #   prob: 1.0
      - aug_type: LowPassAug
        cutoff_ratio: 0.6
        transition_width: 0.08
        prob: 1.0
    # - aug_type: CodecAug
    #   sample_rate: 16000
    #   prob: 0.25
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  num_frms: 200
  resample_rate: 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speed_perturb: true
enable_amp: true
eval_dur: 8.0
exp_dir: exp/vox2_vb2_cnc2/b6_gnorm_100ep/ptn_ha
# gpus: removed - not read by the training code; the number of GPU processes
# comes from launch.sh's second argument (and CUDA_VISIBLE_DEVICES).
log_batch_interval: 25
loss: CrossEntropyLoss
loss_args: {}
loss_weight_decay_mult: 0.5
margin_scheduler: MarginScheduler
margin_update:
  final_margin: 0.2
  fix_start_epoch: 30
  increase_start_epoch: 15
  increase_type: exp
  initial_margin: 0.0
  update_margin: true
mixup_alpha: null
model: ReDimNet2Custom
model_args:
  C: 64
  F: 72
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  causal: none
  compress_tconvs: true
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  fm_weigthing_type: NC
  global_context_att: true
  group_divisor: 1
  hop_length: 160
  out_channels: 224
  pooling_func: ASTP
  return_2d_output: true
  spec_in_channels: 1
  spec_params:
    do_preemph: true
    do_spec_aug: false
    freq_mask_width:
    - 0
    - 6
    norm_signal: true
    time_mask_width:
    - 0
    - 8
  stages_setup:
  - - - 1
      - 1
    - 3
    - 3
    - - - 3
        - 3
    - 64
  - - - 2
      - 1
    - 4
    - 2
    - - - 3
        - 3
    - 64
  - - - 1
      - 2
    - 5
    - 2
    - - - 3
        - 3
    - 48
  - - - 2
      - 1
    - 5
    - 1
    - - - 3
        - 3
    - 48
  - - - 1
      - 2
    - 4
    - 0.75
    - - - 3
        - 3
    - 32
  - - - 2
      - 1
    - 3
    - 0.5
    - - - 3
        - 3
    - 24
  dual_agg: false
  agg_gnorm: true
num_avg: 10
# NOTE: this file sets num_epochs: 120, but exp_dir above is named
# `b6_gnorm_100ep` and the matching lm.yaml loads model_115.pt. These three do
# not agree — confirm which epoch the official result used before relying on
# them.
num_epochs: 120
optimizer: SGD
optimizer_args:
  lr: 0.06
  momentum: 0.9
  nesterov: true
  weight_decay: 2.0e-05
projection_args:
  do_lm: false
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  project_type: sphereface2
  scale: 32.0
  t: 3
save_epoch_interval: 1
scheduler: ExponentialDecayPlateauWithWarmup
scheduler_args:
  initial_lr: 0.06
  final_lr: 1.0e-4
  warm_up_epoch: 8
  warm_from_zero: true
  plateau_epochs: 45
  decay_epochs: 10
  decay_rate: 0.5
  staircase: false
seed: 42
train_data: /data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join/data.list
train_label: /data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join/utt2spk
val_type: local
validation:
  vox1: /data/wespeaker_data/vox1-test
