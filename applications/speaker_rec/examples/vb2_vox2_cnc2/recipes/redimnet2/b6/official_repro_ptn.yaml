# 三语料 B6 官方公开配方的复现实验配置。
# 真实官方基线：c5bbe0b76e37df698c403f8844e41304ceab6307。
# 9d38486 属于 zhounan 的非官方提交，不能当作未经修改的官方代码。
# 以官方三语料专用配方为依据，保留模型、批量、轮数、旧版学习率和增强分布。
# 本次明确关闭 torch.compile，继续直接读取增强目录；这些与公开配方有差别。
# legacy_aug 恢复旧版随机上界和短噪声循环填充，不保证整个训练逐位重现。
# 以完整测试录音的等错误率评测结果验收，不能把短训练权重相同当作最终指标复现。
# PTN 训练 120 轮，LM 明确从第 115 轮权重开始，沿用官方 lm.yaml 的 model_ckpt。
# 第 115/120 轮与目录名 100ep 的冲突来自官方文件；作者未公开最终权重选轮记录。
# 云端必须为本实验覆盖独立 exp_dir，并核实 LM 的 model_ckpt 和 spk2id_map_path。
# 核查说明：docs/12-三语料B6官方复现配方核查.md。
# 主训练使用 200 帧固定裁剪、每卡 96 条、120 轮。
# 增强概率与官方三语料配置相同；只读文件夹，不需要键值库。

compile_backbone: null   # 本次固定使用未编译模型，单独记录这一差异
data_type: raw_fast
dataloader_args:
  batch_size: 96
  drop_last: true
  num_workers: 24
  pin_memory: false
  prefetch_factor: 2
  seed_worker: true
# grad_accum_steps: removed - gradient accumulation is not implemented in this
# training stack, so the value was never read.
dataset_args:
  legacy_aug: true         # 保留官方版本的随机上界和短噪声循环填充
  aug_setup:
    aug_type: Sequential
    prob: 0.9
    augmentors:
    - aug_type: OneOf
      prob: 0.8
      augmentors:
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/music
        snr: [2, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/noise
        snr: [0, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/speech
        snr: [7, 18]
        babble: true
        prob: 1.0
    - aug_type: Reverb
      dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/rirs/simulated_rirs
      file_pattern: '**/*.wav'
      prob: 0.2
    - aug_type: OneOf
      prob: 0.25
      augmentors:
      # - aug_type: LowPassAug
      #   cutoff_ratio: 0.5
      #   transition_width: 0.08
      #   prob: 1.0
      - aug_type: LowPassAug
        cutoff_ratio: 0.6
        transition_width: 0.08
        prob: 1.0
    # - aug_type: CodecAug
    #   sample_rate: 16000
    #   prob: 0.25
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  num_frms: 200
  resample_rate: 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speed_perturb: true
enable_amp: true
eval_dur: 8.0
exp_dir: exp/vox2_vb2_cnc2/b6_gnorm_100ep/ptn_ha
# gpus: removed - not read by the training code; the number of GPU processes
# comes from launch.sh's second argument (and CUDA_VISIBLE_DEVICES).
log_batch_interval: 25
loss: CrossEntropyLoss
loss_args: {}
loss_weight_decay_mult: 0.5
margin_scheduler: MarginScheduler
margin_update:
  final_margin: 0.2
  fix_start_epoch: 30
  increase_start_epoch: 15
  increase_type: exp
  initial_margin: 0.0
  update_margin: true
mixup_alpha: null
model: ReDimNet2Custom
model_args:
  C: 64
  F: 72
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  causal: none
  compress_tconvs: true
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  fm_weigthing_type: NC
  global_context_att: true
  group_divisor: 1
  hop_length: 160
  out_channels: 224
  pooling_func: ASTP
  return_2d_output: true
  spec_in_channels: 1
  spec_params:
    do_preemph: true
    do_spec_aug: false
    freq_mask_width:
    - 0
    - 6
    norm_signal: true
    time_mask_width:
    - 0
    - 8
  stages_setup:
  - - - 1
      - 1
    - 3
    - 3
    - - - 3
        - 3
    - 64
  - - - 2
      - 1
    - 4
    - 2
    - - - 3
        - 3
    - 64
  - - - 1
      - 2
    - 5
    - 2
    - - - 3
        - 3
    - 48
  - - - 2
      - 1
    - 5
    - 1
    - - - 3
        - 3
    - 48
  - - - 1
      - 2
    - 4
    - 0.75
    - - - 3
        - 3
    - 32
  - - - 2
      - 1
    - 3
    - 0.5
    - - - 3
        - 3
    - 24
  dual_agg: false
  agg_gnorm: true
num_avg: 10
# 保留官方配置的 120 轮，保留第 115 和 120 轮权重。
# 本次 LM 使用第 115 轮；目录名中的 100ep 不作为训练轮数依据。
num_epochs: 120
optimizer: SGD
optimizer_args:
  lr: 0.06
  momentum: 0.9
  nesterov: true
  weight_decay: 2.0e-05
projection_args:
  do_lm: false
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  project_type: sphereface2
  scale: 32.0
  t: 3
save_epoch_interval: 1
scheduler: ExponentialDecayPlateauWithWarmup
scheduler_args:
  lr_scaling: legacy       # 八卡、每卡96条：倍率12，实际峰值0.72
  decay_to_final_lr: false # 保留官方半衰期，final_lr不决定本调度器终点
  initial_lr: 0.06
  final_lr: 1.0e-4
  warm_up_epoch: 8
  warm_from_zero: true
  plateau_epochs: 45
  decay_epochs: 10
  decay_rate: 0.5
  staircase: false
seed: 42
train_data: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join/data.list
train_label: /root/group-shared/voiceprint/data/wespeaker_data/vox2_vb2_cnc2_v0/mix_join/utt2spk
val_type: local
validation:
  vox1: /root/group-shared/voiceprint/data/wespeaker_data/vox1-test
