compile_backbone:
  mode: default
data_type: raw_fast
dataloader_args:
  batch_size: 512
  drop_last: true
  num_workers: 16
  pin_memory: false
  prefetch_factor: 2
dataset_args:
  aug_setup:
    aug_type: Sequential
    prob: 0.6
    augmentors:
    - aug_type: OneOf
      prob: 0.8
      augmentors:
      - aug_type: CustomNoise
        dataset_dir: /data/wespeaker_data/raw/musan/music
        snr: [2, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /data/wespeaker_data/raw/musan/noise
        snr: [0, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /data/wespeaker_data/raw/musan/speech
        snr: [7, 18]
        babble: true
        prob: 1.0
    - aug_type: Reverb
      dataset_dir: /data/wespeaker_data/raw/rirs/simulated_rirs
      file_pattern: '**/*.wav'
      prob: 0.2
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  num_frms: 200
  resample_rate: 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speed_perturb: true
enable_amp: true
eval_dur: 8.0
exp_dir: exp/redimnet2/b0/conv_att/ptn
log_batch_interval: 25
loss: CrossEntropyLoss
loss_args: {}
loss_weight_decay_mult: 5.0
margin_scheduler: MarginScheduler
margin_update:
  final_margin: 0.20
  fix_start_epoch: 40
  increase_start_epoch: 20
  increase_type: exp
  initial_margin: 0.0
  update_margin: true
mixup_alpha: null
model: ReDimNet2Custom
model_args:
  C: 12
  F: 72
  agg_gnorm: true
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  causal: none
  compress_tconvs: true
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  fm_weigthing_type: NC
  global_context_att: true
  group_divisor: 1
  hop_length: 160
  out_channels: 64
  pooling_func: ASTP
  return_2d_output: true
  spec_in_channels: 1
  spec_params:
    do_preemph: true
    do_spec_aug: false
    norm_signal: true
  stages_setup:
  - [[1, 1], 2, 2, [[3, 3]], 36]
  - [[2, 1], 3, 1, [[3, 3]], 36]
  - [[1, 2], 4, 1, [[3, 3]], 36]
  - [[2, 1], 5, 1, [[3, 3]], 36]
  - [[1, 2], 4, 1, [[3, 3]], 18]
  - [[2, 1], 3, 1, [[3, 3]], 18]
num_avg: 10
num_epochs: 120
optimizer: SGD
optimizer_args:
  lr: 0.1
  momentum: 0.9
  nesterov: true
  weight_decay: 2.0e-05
projection_args:
  do_lm: false
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  num_class: 17982
  project_type: sphereface2
  scale: 32.0
  t: 3
save_epoch_interval: 5
scheduler: ExponentialDecrease
scheduler_args:
  final_lr: 6.0e-05
  initial_lr: 0.1
  warm_from_zero: true
  warm_up_epoch: 6
seed: 42
train_data: /data/wespeaker_data/vox2_dev/data.list
train_label: /data/wespeaker_data/vox2_dev/utt2spk
val_type: local
validation:
  vox1: /data/wespeaker_data/vox1-test
