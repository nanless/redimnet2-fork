# 这是对应固定长度配方的变长版本：只多了 dataset_args.bucketing 与
# dataset_args.varlen 两个块，并把 exp_dir 换个名字。其余训练设置与固定长度版一致。
compile_backbone:
  mode: default
data_type: raw_fast
dataloader_args:
  batch_size: 64
  drop_last: true
  num_workers: 16
  pin_memory: false
  prefetch_factor: 2
# gpus: removed - not read by the training code; the number of GPU processes
# comes from launch.sh's second argument (and CUDA_VISIBLE_DEVICES). The old
# `gpus: [0]` here never restricted training to one GPU.
dataset_args:
  # ── 变长训练新增：长度分桶（训练策略，与模型层无关）──
  # 把长度接近的样本放进同一批，缩小补齐比例；关掉这一块就回到固定长度行为。
  bucketing:
    enable: true
    bucket_count: 6
    bucket_width_sec: 1.0
    shuffle_buckets: true
  aug_setup:
    aug_type: Sequential
    prob: 0.6
    augmentors:
    - aug_type: OneOf
      prob: 0.8
      augmentors:
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/music
        snr: [2, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/noise
        snr: [0, 12]
        prob: 1.0
      - aug_type: CustomNoise
        dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/musan/speech
        snr: [7, 18]
        babble: true
        prob: 1.0
    - aug_type: Reverb
      dataset_dir: /root/group-shared/voiceprint/data/wespeaker_data/raw/rirs/simulated_rirs
      file_pattern: '**/*.wav'
      prob: 0.2
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  num_frms: 600
  resample_rate: 16000
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speed_perturb: false
  # ── 变长训练新增：不再强制截成固定长度 ──
  # 每条按自己的真实长度送入模型（右侧补零凑批，并回传真实长度给掩码）。
  # min_sec / max_sec 是可变长度路径的时长范围；max_batch_sec 限制一批的总秒数。
  varlen:
    enable: true
    min_sec: 2.0
    max_sec: 6.0
    max_batch_sec: 900.0
do_lm: true
enable_amp: true
eval_dur: 8.0
exp_dir: exp/redimnet2/b3/conv_att/varlen_lm
# gpus: removed - not read by the training code; the number of GPU processes
# comes from launch.sh's second argument (and CUDA_VISIBLE_DEVICES). The old
# `gpus: [0]` here never restricted training to one GPU.
log_batch_interval: 25
loss: CrossEntropyLoss
loss_args: {}
margin_scheduler: MarginScheduler
margin_update:
  final_margin: 0.3
  fix_start_epoch: 1
  increase_start_epoch: 1
  increase_type: exp
  initial_margin: 0.3
  update_margin: true
mixup_alpha: null
model: ReDimNet2Custom
model_args:
  C: 24
  F: 72
  agg_gnorm: true
  block_1d_type: conv+att
  block_2d_type: basic_resnet
  causal: none
  compress_tconvs: true
  emb_bn: false
  embed_dim: 192
  feat_type: tf
  fm_weigthing_type: NC
  global_context_att: true
  group_divisor: 1
  hop_length: 160
  pooling_func: ASTP
  return_2d_output: true
  spec_in_channels: 1
  spec_params:
    do_preemph: true
    do_spec_aug: false
    norm_signal: true
model_ckpt: exp/redimnet2/b3/conv_att/ptn/models/model_120.pt
num_avg: 10
num_epochs: 5
optimizer: SGD
optimizer_args:
  lr: 0.0001
  momentum: 0.9
  nesterov: true
  weight_decay: 0.0001
projection_args:
  do_lm: true
  easy_margin: false
  embed_dim: 192
  lanbuda: 0.7
  margin_type: C
  num_class: 5994
  project_type: sphereface2
  scale: 32.0
  t: 3
save_epoch_interval: 1
scheduler: ExponentialDecrease
scheduler_args:
  final_lr: 2.5e-05
  initial_lr: 0.0001
  warm_from_zero: true
  warm_up_epoch: 1
seed: 42
train_data: /root/group-shared/voiceprint/data/wespeaker_data/vox2_dev/data.list
train_label: /root/group-shared/voiceprint/data/wespeaker_data/vox2_dev/utt2spk
val_type: local
validation:
  vox1: /root/group-shared/voiceprint/data/wespeaker_data/vox1-test
